<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2459d3"><title>優惠券核銷策略測試頁</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#182230;--muted:#748094;--line:#e7ebf1;--blue:#315fce;--blue2:#edf3ff;--green:#16845b;--greenbg:#eff9f3;--shadow:0 8px 28px rgba(25,42,70,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
main{max-width:780px;margin:auto;padding:26px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 20px}
h1{font-size:23px;letter-spacing:-.4px;margin:0}h2{font-size:16px;margin:0;font-weight:750}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;margin:12px 0;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.status{font-size:12px;color:var(--muted);padding:7px 10px;background:#f1f4f8;border-radius:99px;line-height:1.4}
.status:empty{display:none}
label{display:block;font-size:12px;color:#536074;font-weight:700;margin-bottom:7px}
input,select{width:100%;font:inherit;font-size:14px;padding:12px 13px;border:1px solid #dce2eb;border-radius:11px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:#7c9bea;box-shadow:0 0 0 3px #315fce14}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:750;padding:13px 17px;cursor:pointer}
.btn.secondary{background:var(--blue2);color:var(--blue)}
.btn.full{width:100%;margin-top:14px}
.btn.small{padding:8px 11px;font-size:12px}
.authrow{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}
.authrow .btn{height:43px;white-space:nowrap}
.wallets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.wallet{border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
.wallet strong{display:block;font-size:13px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.chip{border-radius:7px;padding:5px 7px;font-size:12px;font-weight:750;background:#fff1c7;color:#755600}
.chip.blue{background:#e6efff;color:#2455a5}
.wallet .muted{font-size:11px;margin:7px 0 0}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.hint{margin:10px 1px 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:#f4f6fa;border-radius:12px;padding:12px}
.stat span{display:block;font-size:11px;color:var(--muted);line-height:1.4}
.stat strong{display:block;font-size:20px;margin-top:5px;letter-spacing:-.3px}
.result{background:var(--greenbg);border:1px solid #d5ecdf;border-radius:14px;padding:15px;margin-top:12px}
.result h3{margin:0 0 9px;font-size:15px}
.result p{font-size:12px;line-height:1.6;margin:7px 0;color:#52665c}
.payrow{padding:11px 0;border-bottom:1px solid #dcebe2;font-size:13px;line-height:1.6}
.payrow:last-child{border:0}
.pill{display:inline-block;background:#dcefe6;color:#126746;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:750}
details{border-top:1px solid var(--line);margin-top:15px;padding-top:13px}
summary{font-size:13px;font-weight:700;color:#43516a;cursor:pointer;list-style:none}
summary:after{content:"＋";float:right;color:var(--blue)}
details[open] summary:after{content:"－"}
#inputs{margin-top:14px}
#inputs>div{margin-bottom:10px}
#inputs input{padding:9px 11px;font-size:13px}
.error{color:#b42318;font-size:12px;margin-top:8px}
@media(max-width:600px){main{padding:18px 11px 36px}header{margin-bottom:14px}h1{font-size:20px}.card{padding:15px;border-radius:15px}.wallets{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:19px}.authrow{grid-template-columns:1fr 1fr}.authrow .btn{grid-column:1/-1;width:100%}}
</style></head><body><main>
<header><div><h1>優惠券核銷計算器</h1><div class="sub">讀取個人雲端券庫 · 僅供試算，不會更改資料</div></div><span class="status" id="cloudStatus">檢查登入中…</span></header>
<section class="card" id="cloudAuth">
 <div class="cardhead"><h2>登入你的帳戶</h2></div>
 <div class="authrow"><div><label for="email">電郵</label><input id="email" type="email" autocomplete="username" placeholder="登入電郵"></div><div><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="登入密碼"></div><button class="btn" id="loginCloud">登入並載入</button></div>
</section>
<section class="card">
 <div class="cardhead"><h2>我的可用優惠券</h2><div><button class="btn secondary small" id="reloadCloud">重新載入</button> <button class="btn secondary small" id="logoutCloud">登出</button></div></div>
 <div class="wallets" id="wallets"></div>
 <div class="muted hint" id="walletCountHint">登入後自動顯示錢包及可用優惠券。</div>
</section>
<section class="card">
 <div class="cardhead"><h2>消費及付款設定</h2></div>
 <div class="fields">
  <div><label for="spend">消費金額（MOP）</label><input id="spend" type="number" min="1" value="260" step="0.01"></div>
  <div><label for="maxTx">最多使用錢包數</label><select id="maxTx"><option value="1">1 個</option><option value="2">2 個</option><option value="3" selected>3 個</option><option value="4">4 個</option><option value="8">不限（最多 8 個）</option></select></div>
  <div style="grid-column:1/-1"><label for="mode">計算策略</label><select id="mode"><option value="use" selected>最高核銷券值</option><option value="few">最少付款錢包</option></select></div>
 </div>
 <button class="btn full" id="calculate">計算最佳方案</button>
</section>
<section class="card">
 <div class="cardhead"><h2>計算結果</h2></div>
 <div id="summary" class="muted">輸入消費金額，按「計算最佳方案」。</div><div id="details"></div>
</section>
<section class="card">
 <details><summary>調整優惠券面額（只影響本次試算）</summary>
  <p class="muted">修改或刪除面額後，按「更新券庫」。不會改動雲端紀錄。</p>
  <div class="fields" id="inputs"></div><button class="btn secondary full" id="refresh">更新券庫</button><div id="inputError" class="error"></div>
 </details>
</section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://wokoioenlqtsmhyobxko.supabase.co';
const SUPABASE_KEY='sb_publishable_Ds1oRszcoozkgZju6o1L9w_HP60YnpO';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null, walletRows=[], couponRows=[], walletInputs={};
const inputs=document.getElementById('inputs');
const walletBox=document.getElementById('wallets');
const authBox=document.getElementById('cloudAuth');
const statusBox=document.getElementById('cloudStatus');
function money(n){return 'MOP '+Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function expiryDate(claim){const d=new Date(String(claim.claimed_on)+'T12:00:00');const days=(4-d.getDay()+7)%7;d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function todayLocal(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function showStatus(msg,error=false){statusBox.textContent=msg;statusBox.style.color=error?'#b42318':'#16845b'}
function renderWallets(){
 const active=walletRows.filter(w=>!w.is_archived);
 walletBox.innerHTML=active.map(w=>{
  const cs=couponRows.filter(c=>c.wallet_id===w.id);
  return '<div class="wallet"><strong>'+escapeHtml(w.name)+(w.owner_name&&w.owner_name!=='自己'?' · '+escapeHtml(w.owner_name):'')+'</strong><div class="chips">'+(cs.length?cs.map(x=>'<span class="chip '+(Number(x.coupon_value)<50?'blue':'')+'">'+Number(x.coupon_value)+'</span>').join(''):'<span class="muted">沒有可用券</span>')+'</div><p class="muted">可用 '+cs.length+' 張 · '+money(cs.reduce((s,x)=>s+Number(x.coupon_value||0),0))+'</p></div>';
 }).join('')||'<div class="muted">帳戶目前沒有可用錢包。</div>';
 inputs.innerHTML=active.map(w=>{
  const cs=couponRows.filter(c=>c.wallet_id===w.id);
  const vals=cs.map(x=>x.coupon_value).join(',');
  walletInputs[w.id]=vals;
  return '<div><label for="wallet_'+w.id+'">'+escapeHtml(w.name)+(w.owner_name&&w.owner_name!=='自己'?' · '+escapeHtml(w.owner_name):'')+'</label><input id="wallet_'+w.id+'" data-wallet="'+w.id+'" value="'+vals+'" inputmode="decimal" placeholder="沒有優惠券"></div>';
 }).join('')||'<p class="muted">沒有錢包可供計算。</p>';
 const max=document.getElementById('maxTx');
 const old=Number(max.value)||3;
 max.innerHTML=Array.from({length:Math.max(1,active.length)},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+' 個錢包</option>').join('');
 max.value=String(Math.min(old,Math.max(1,active.length)));
 document.getElementById('walletCountHint').textContent=active.length+' 個錢包 · '+couponRows.length+' 張可用券';
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function readCoupons(){
 const out=[];
 for(const w of walletRows.filter(x=>!x.is_archived)){
  const el=document.getElementById('wallet_'+w.id);
  const raw=el?el.value.trim():'';
  if(!raw)continue;
  const vals=raw.split(',').map(x=>Number(x.trim()));
  if(vals.some(x=>!Number.isFinite(x)||x<=0))throw Error('錢包「'+w.name+'」有無效面額，請檢查輸入。');
  vals.forEach((value,i)=>out.push({value,wallet:w.id,walletName:w.name,id:w.id+'-'+i}));
 }
 return out;
}
function refreshWallets(){try{const data=readCoupons();walletBox.innerHTML=walletRows.filter(w=>!w.is_archived).map(w=>{const cs=data.filter(c=>c.wallet===w.id);return '<div class="wallet"><strong>'+escapeHtml(w.name)+(w.owner_name&&w.owner_name!=='自己'?' · '+escapeHtml(w.owner_name):'')+'</strong><div class="chips">'+(cs.length?cs.map(c=>'<span class="chip '+(c.value<50?'blue':'')+'">'+c.value+'</span>').join(''):'<span class="muted">沒有優惠券</span>')+'</div><p class="muted">共 '+cs.length+' 張 · '+money(cs.reduce((s,c)=>s+c.value,0))+'</p></div>'}).join('');document.getElementById('inputError').textContent='';return true}catch(e){document.getElementById('inputError').textContent=e.message;return false}}
async function loadCloudData(){
 if(!currentUser){showStatus('請先登入正式 APP 使用的帳戶。',true);return}
 showStatus('正在讀取你的錢包及優惠券…');
 const [w,c]=await Promise.all([
  db.from('wallets').select('id,name,owner_name,is_archived,created_at').eq('user_id',currentUser.id).order('created_at'),
  db.from('reward_claims').select('id,wallet_id,claimed_on,coupon_value,redeemed,result_type').eq('user_id',currentUser.id).eq('result_type','coupon').eq('redeemed',false).not('coupon_value','is',null).order('claimed_on',{ascending:false})
 ]);
 if(w.error)throw w.error;if(c.error)throw c.error;
 walletRows=w.data||[];
 const today=todayLocal();
 couponRows=(c.data||[]).filter(x=>Number(x.coupon_value)>0&&expiryDate(x)>=today&&walletRows.some(w=>w.id===x.wallet_id&&!w.is_archived));
 renderWallets();
 showStatus('已同步 · '+walletRows.filter(w=>!w.is_archived).length+' 個錢包 · '+couponRows.length+' 張可用券');
 calculate();
}
async function authIn(){
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password)throw Error('請輸入正式 APP 的登入電郵及密碼。');
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error)throw error;
 currentUser=data.user;authBox.classList.add('hidden');await loadCloudData();
}
async function initAuth(){
 const {data,error}=await db.auth.getSession();if(error)throw error;
 currentUser=data.session?.user||null;
 if(currentUser){authBox.classList.add('hidden');await loadCloudData()}else{authBox.classList.remove('hidden');showStatus('尚未登入。請使用正式 APP 的同一帳戶登入。')}
 db.auth.onAuthStateChange((event,session)=>{currentUser=session?.user||null;if(!currentUser){walletRows=[];couponRows=[];walletBox.innerHTML='';inputs.innerHTML='';authBox.classList.remove('hidden');showStatus('已登出，請重新登入。',true)}else if(event==='SIGNED_IN'){authBox.classList.add('hidden');loadCloudData().catch(e=>showStatus(e.message,true))}});
}
function calculate(){
 const spend=Number(document.getElementById('spend').value)||0,maxWallets=Number(document.getElementById('maxTx').value),mode=document.getElementById('mode').value,summary=document.getElementById('summary'),details=document.getElementById('details');
 let all;try{all=readCoupons()}catch(e){summary.textContent=e.message;details.innerHTML='';return}
 if(spend<=0){summary.textContent='請輸入大於 0 的消費金額。';details.innerHTML='';return}
 const limitCents=Math.floor((spend/3)*100+1e-8);
 const walletGroups=walletRows.filter(w=>!w.is_archived).map(w=>({id:w.id,name:w.name,coupons:all.filter(c=>c.wallet===w.id)}));
 let dp=new Map([['0|0',{count:0,sumCents:0,choices:[]} ]]);
 for(const wallet of walletGroups){
  const options=[{sumCents:0,coupons:[]}],m=wallet.coupons.length;
  for(let mask=1;mask<(1<<m);mask++){
   const picked=wallet.coupons.filter((_,i)=>mask&(1<<i));
   const sumCents=picked.reduce((s,x)=>s+Math.round(x.value*100),0);
   if(sumCents<=limitCents)options.push({sumCents,coupons:picked});
  }
  const next=new Map(dp);
  for(const state of dp.values())for(const option of options){
   if(!option.coupons.length)continue;
   const count=state.count+1;if(count>maxWallets)continue;
   const sumCents=state.sumCents+option.sumCents;if(sumCents>limitCents)continue;
   const key=count+'|'+sumCents;
   if(!next.has(key))next.set(key,{count,sumCents,choices:[...state.choices,{wallet:wallet.id,walletName:wallet.name,coupons:option.coupons}]});
  }
  dp=next;
 }
 const candidates=[...dp.values()].filter(s=>s.count>0);
 candidates.sort((a,b)=>mode==='use'?(b.sumCents-a.sumCents)||(a.count-b.count):(a.count-b.count)||(b.sumCents-a.sumCents));
 const selected=candidates[0]||{count:0,sumCents:0,choices:[]};
 const chosen=selected.choices.flatMap(x=>x.coupons),sum=selected.sumCents/100;
 const payments=selected.choices.map(x=>({wallet:x.wallet,walletName:x.walletName,coupons:x.coupons,minimum:x.coupons.reduce((s,c)=>s+c.value,0)*3}));
 const minTotal=payments.reduce((s,p)=>s+p.minimum,0),best={chosen,sum,payments,minTotal};
 if(!best.chosen.length){summary.textContent='目前消費額及錢包付款上限下，沒有可核銷的優惠券。';details.innerHTML='';return}
 const allocations=best.payments.map(p=>({...p,amount:p.minimum}));
 if(allocations.length)allocations[allocations.length-1].amount+=spend-best.minTotal;
 const total=all.reduce((s,c)=>s+c.value,0),uncovered=Math.max(0,spend-best.minTotal);
 summary.innerHTML='<div class="stats"><div class="stat"><span>能核銷券值</span><strong style="color:var(--green)">'+money(best.sum)+'</strong></div><div class="stat"><span>能核銷錢包</span><strong>'+allocations.length+' 個</strong></div><div class="stat"><span>核銷所需最低消費額</span><strong>'+money(best.minTotal)+'</strong></div><div class="stat"><span>未能涵蓋消費額</span><strong>'+money(uncovered)+'</strong></div></div><div class="result"><h3>建議付款分配</h3><p>消費總額為 '+money(spend)+'。優惠券抵扣 '+money(best.sum)+'，消費者實際支出為 '+money(spend-best.sum)+'。核銷所需最低消費額是各錢包所用優惠券面額合計的 3 倍。</p><p><strong>整體金額：</strong>消費總額 '+money(spend)+'　｜　優惠券抵扣 '+money(best.sum)+'　｜　消費者實際支出 '+money(spend-best.sum)+'</p>'+allocations.map((p,i)=>'<div class="payrow"><span class="pill">消費分配 '+(i+1)+'</span>　<strong>'+escapeHtml(p.walletName)+'</strong> 消費金額 <strong>'+money(p.amount)+'</strong><br><span class="muted">使用優惠券：'+p.coupons.map(c=>money(c.value)).join('、')+'（共 '+money(p.coupons.reduce((s,c)=>s+c.value,0))+'） · 消費者實際支出 '+money(p.amount-p.coupons.reduce((s,c)=>s+c.value,0))+' · 核銷最低消費額 '+money(p.minimum)+'</span></div>').join('')+'<p><strong>未使用券值：'+money(total-best.sum)+'；消費分配合計：'+money(allocations.reduce((s,p)=>s+p.amount,0))+'。</strong></p></div>';
 details.innerHTML='';
}
document.getElementById('calculate').addEventListener('click',calculate);
document.getElementById('refresh').addEventListener('click',()=>{if(refreshWallets())calculate()});
document.getElementById('reloadCloud').addEventListener('click',()=>loadCloudData().catch(e=>showStatus(e.message,true)));
document.getElementById('loginCloud').addEventListener('click',()=>authIn().catch(e=>showStatus(e.message,true)));
document.getElementById('logoutCloud').addEventListener('click',()=>db.auth.signOut().then(()=>showStatus('已登出。')).catch(e=>showStatus(e.message,true)));
initAuth().catch(e=>showStatus(e.message,true));
</script></body></html>
